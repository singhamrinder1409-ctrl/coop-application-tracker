<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
  <defs>
    <style>
      .page { fill: #fbfbf8; }
      .title { font: 700 34px Arial, sans-serif; fill: #1f2933; }
      .subtitle { font: 18px Arial, sans-serif; fill: #52606d; }
      .entity { fill: #ffffff; stroke: #1f2933; stroke-width: 2.2; rx: 10; }
      .entity-title { font: 700 20px Arial, sans-serif; fill: #102a43; }
      .attr { font: 16px Arial, sans-serif; fill: #334e68; }
      .key { font: 700 16px Arial, sans-serif; fill: #102a43; }
      .line { stroke: #334e68; stroke-width: 2.5; fill: none; }
      .label { font: 15px Arial, sans-serif; fill: #243b53; }
      .badge { fill: #e0f2fe; stroke: #0284c7; stroke-width: 1; rx: 8; }
      .badgeText { font: 700 14px Arial, sans-serif; fill: #075985; }
    </style>
  </defs>

  <rect class="page" x="0" y="0" width="1600" height="1050"/>
  <text class="title" x="70" y="70">Co-op Application Tracker ERD</text>
  <text class="subtitle" x="70" y="103">Rendered version of the conceptual design for the CSC 370 kick-off submission.</text>

  <!-- Entities -->
  <g id="student">
    <rect class="entity" x="80" y="170" width="270" height="195"/>
    <text class="entity-title" x="105" y="205">Student</text>
    <text class="key" x="105" y="245">PK student_id</text>
    <text class="attr" x="105" y="275">full_name</text>
    <text class="attr" x="105" y="305">username</text>
    <text class="attr" x="105" y="335">email</text>
  </g>

  <g id="resume">
    <rect class="entity" x="80" y="560" width="285" height="205"/>
    <text class="entity-title" x="105" y="595">ResumeVersion</text>
    <text class="key" x="105" y="635">PK resume_id</text>
    <text class="attr" x="105" y="665">FK student_id</text>
    <text class="attr" x="105" y="695">resume_label</text>
    <text class="attr" x="105" y="725">version_number</text>
  </g>

  <g id="application">
    <rect class="entity" x="620" y="385" width="330" height="245"/>
    <text class="entity-title" x="645" y="420">Application</text>
    <text class="key" x="645" y="460">PK application_id</text>
    <text class="attr" x="645" y="490">FK student_id</text>
    <text class="attr" x="645" y="520">FK posting_id</text>
    <text class="attr" x="645" y="550">FK status_id</text>
    <text class="attr" x="645" y="580">FK resume_id</text>
    <text class="attr" x="645" y="610">date_applied, priority</text>
  </g>

  <g id="status">
    <rect class="entity" x="620" y="760" width="295" height="165"/>
    <text class="entity-title" x="645" y="795">ApplicationStatus</text>
    <text class="key" x="645" y="835">PK status_id</text>
    <text class="attr" x="645" y="865">status_name</text>
    <text class="attr" x="645" y="895">is_terminal</text>
  </g>

  <g id="employer">
    <rect class="entity" x="1230" y="170" width="285" height="205"/>
    <text class="entity-title" x="1255" y="205">Employer</text>
    <text class="key" x="1255" y="245">PK employer_id</text>
    <text class="attr" x="1255" y="275">employer_name</text>
    <text class="attr" x="1255" y="305">industry</text>
    <text class="attr" x="1255" y="335">website, location</text>
  </g>

  <g id="posting">
    <rect class="entity" x="1200" y="495" width="330" height="255"/>
    <text class="entity-title" x="1225" y="530">JobPosting</text>
    <text class="key" x="1225" y="570">PK posting_id</text>
    <text class="attr" x="1225" y="600">FK employer_id</text>
    <text class="attr" x="1225" y="630">job_title</text>
    <text class="attr" x="1225" y="660">work_term</text>
    <text class="attr" x="1225" y="690">deadline, status</text>
    <text class="attr" x="1225" y="720">location, posting_url</text>
  </g>

  <g id="interview">
    <rect class="entity" x="650" y="95" width="295" height="205"/>
    <text class="entity-title" x="675" y="130">Interview</text>
    <text class="key" x="675" y="170">PK interview_id</text>
    <text class="attr" x="675" y="200">FK application_id</text>
    <text class="attr" x="675" y="230">interview_round</text>
    <text class="attr" x="675" y="260">scheduled_at, result</text>
  </g>

  <g id="offer">
    <rect class="entity" x="1030" y="840" width="300" height="165"/>
    <text class="entity-title" x="1055" y="875">Offer</text>
    <text class="key" x="1055" y="915">PK offer_id</text>
    <text class="attr" x="1055" y="945">FK application_id</text>
    <text class="attr" x="1055" y="975">wage, dates, status</text>
  </g>

  <!-- Relationships -->
  <path class="line" d="M350 250 C470 250, 500 470, 620 470"/>
  <rect class="badge" x="420" y="318" width="126" height="30"/>
  <text class="badgeText" x="437" y="339">1 to many</text>
  <text class="label" x="410" y="370">Student submits Applications</text>

  <path class="line" d="M350 300 C450 375, 480 590, 620 575"/>
  <rect class="badge" x="438" y="510" width="126" height="30"/>
  <text class="badgeText" x="455" y="531">1 to many</text>
  <text class="label" x="392" y="560">Student has ResumeVersions</text>

  <path class="line" d="M365 660 C465 660, 520 585, 620 570"/>
  <rect class="badge" x="405" y="675" width="126" height="30"/>
  <text class="badgeText" x="422" y="696">1 to many</text>
  <text class="label" x="392" y="725">Resume used for Applications</text>

  <path class="line" d="M1230 300 C1120 330, 1065 440, 950 500"/>
  <rect class="badge" x="1035" y="346" width="126" height="30"/>
  <text class="badgeText" x="1052" y="367">1 to many</text>
  <text class="label" x="1010" y="395">Employer posts Jobs</text>

  <path class="line" d="M1200 620 C1090 600, 1045 535, 950 515"/>
  <rect class="badge" x="1010" y="625" width="126" height="30"/>
  <text class="badgeText" x="1027" y="646">1 to many</text>
  <text class="label" x="1010" y="680">Posting receives Applications</text>

  <path class="line" d="M765 760 L780 630"/>
  <rect class="badge" x="808" y="670" width="126" height="30"/>
  <text class="badgeText" x="825" y="691">1 to many</text>
  <text class="label" x="808" y="725">Status labels Applications</text>

  <path class="line" d="M800 300 L795 385"/>
  <rect class="badge" x="825" y="330" width="126" height="30"/>
  <text class="badgeText" x="842" y="351">1 to many</text>
  <text class="label" x="835" y="378">Application has Interviews</text>

  <path class="line" d="M900 630 C970 730, 1040 790, 1115 840"/>
  <rect class="badge" x="982" y="745" width="150" height="30"/>
  <text class="badgeText" x="1000" y="766">0 or 1 offer</text>
  <text class="label" x="975" y="810">Application may receive Offer</text>

  <!-- Small legend -->
  <rect class="entity" x="80" y="880" width="430" height="105"/>
  <text class="entity-title" x="105" y="915">Legend</text>
  <text class="attr" x="105" y="950">PK = primary key, FK = foreign key</text>
  <text class="attr" x="105" y="975">Relationship labels show multiplicity in plain words.</text>
</svg>
