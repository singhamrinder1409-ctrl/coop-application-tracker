<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1250" viewBox="0 0 1800 1250">
  <defs>
    <style>
      .page { fill: #ffffff; }
      .shape { fill: #ffffff; stroke: #000000; stroke-width: 2.2; }
      .line { stroke: #000000; stroke-width: 2; fill: none; }
      .title { font: 700 34px Arial, sans-serif; fill: #000000; }
      .subtitle { font: 18px Arial, sans-serif; fill: #000000; }
      .entityText { font: 700 20px Arial, sans-serif; fill: #000000; text-anchor: middle; dominant-baseline: middle; }
      .relText { font: 700 17px Arial, sans-serif; fill: #000000; text-anchor: middle; dominant-baseline: middle; }
      .attrText { font: 15px Arial, sans-serif; fill: #000000; text-anchor: middle; dominant-baseline: middle; }
      .idText { font: 700 15px Arial, sans-serif; fill: #000000; text-anchor: middle; dominant-baseline: middle; text-decoration: underline; }
      .mult { font: 15px Arial, sans-serif; fill: #000000; text-anchor: middle; dominant-baseline: middle; }
      .note { font: 15px Arial, sans-serif; fill: #000000; }
    </style>
  </defs>

  <rect class="page" x="0" y="0" width="1800" height="1250"/>
  <text class="title" x="70" y="65">Co-op Application Tracker ERD</text>
  <text class="subtitle" x="70" y="98">Chen-style ERD: rectangles = entity sets, diamonds = relationships, ellipses = attributes.</text>
  <text class="subtitle" x="70" y="124">Identifier attributes are underlined.</text>

