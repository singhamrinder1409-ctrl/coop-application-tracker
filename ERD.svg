<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1930" viewBox="0 0 1320 1930">
<rect width="100%" height="100%" fill="#f4f7fb"/>
<style>text{font-family:ui-monospace,monospace;fill:#172a42} .title{font-family:Arial;font-weight:bold}</style>
<text x="28" y="36" font-size="25" class="title">Co-op Application Tracker · Complete relational ERD</text>
<text x="28" y="62" font-size="14">Every attribute shown · PK primary key · FK foreign key · ? nullable · relationship cardinalities below</text>
<g id="entity-Student">
<rect x="24" y="88" width="408" height="424" rx="10" fill="white" stroke="#bccbdb"/>
<text x="38" y="118" font-size="19" class="title">Student</text>
<text x="38" y="148" font-size="13">student_id PK </text>
<text x="38" y="173" font-size="13">full_name </text>
<text x="38" y="198" font-size="13">username </text>
<text x="38" y="223" font-size="13">email ?</text>
<text x="38" y="248" font-size="13">program ?</text>
<text x="38" y="489" font-size="11">Keys: student_id; username</text>
</g>
